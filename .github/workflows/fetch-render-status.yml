name: Fetch Render Status

on:
  workflow_dispatch:   # trigger manually on demand
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch /status and /scan from Render
        run: |
          BASE="https://polymarket-weather-agent.onrender.com"
          mkdir -p data/pw_trades

          # Full status blob -- /status includes trades[]
          curl -s --max-time 30 "$BASE/status" \
            -o data/pw_render_status.json \
            || echo '{"error":"unreachable"}' > data/pw_render_status.json

          # Scan diagnostics -- shows why opportunities = 0
          curl -s --max-time 60 "$BASE/scan" \
            -o data/pw_render_scan.json \
            || echo '{"error":"scan unreachable"}' > data/pw_render_scan.json

          # Parsed summary
          python3 -c "
import json, sys
with open('data/pw_render_status.json') as f:
  d = json.load(f)
risk = d.get('last_result', {}).get('risk', {})
trades = d.get('trades', [])

# Try to get scan stats
try:
  with open('data/pw_render_scan.json') as f:
    scan = json.load(f)
except Exception:
  scan = {}

print(json.dumps({
  'cycles':          d.get('cycles'),
  'boot_done':       d.get('boot_done'),
  'last_cycle':      d.get('last_cycle'),
  'live_trading':    d.get('last_result', {}).get('live_trading'),
  'opportunities':   d.get('last_result', {}).get('opportunities'),
  'trades_placed':   d.get('last_result', {}).get('trades_placed'),
  'new_resolutions': d.get('last_result', {}).get('new_resolutions'),
  'total_resolutions': d.get('last_result', {}).get('total_resolutions'),
  'bankroll':        risk.get('bankroll'),
  'total_pnl':       risk.get('total_pnl'),
  'daily_pnl':       risk.get('daily_pnl'),
  'open_positions':  risk.get('open_positions'),
  'trade_count':     risk.get('trade_count'),
  'halted':          risk.get('halted'),
  'halt_reason':     risk.get('halt_reason'),
  'trade_log_count': len(trades),
  'scan_total_markets':   scan.get('total_markets'),
  'scan_low_liquidity':   scan.get('low_liquidity_skipped'),
  'scan_no_city_match':   scan.get('no_city_match'),
  'scan_price_extreme':   scan.get('price_at_extreme'),
  'scan_below_edge':      scan.get('below_edge_threshold'),
  'scan_opportunities':   scan.get('opportunities'),
}, indent=2))
" > data/pw_render_summary.json 2>/dev/null \
            || echo '{"error":"parse failed"}' > data/pw_render_summary.json

          # Extract trade log from status blob
          python3 -c "
import json
with open('data/pw_render_status.json') as f:
  d = json.load(f)
trades = d.get('trades', [])
with open('data/pw_trades/trade_log.json', 'w') as f:
  json.dump(trades, f, indent=2)
print(f'Extracted {len(trades)} trades')
" 2>/dev/null || echo '[]' > data/pw_trades/trade_log.json

      - name: Commit snapshot
        # Skip the push when triggered by a push event — GitHub blocks
        # write-back from push-triggered workflows to prevent infinite loops.
        # workflow_dispatch runs commit + push normally.
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pw_render_status.json data/pw_render_summary.json data/pw_render_scan.json data/pw_trades/trade_log.json
          git diff --cached --quiet || git commit -m "chore: render status snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
